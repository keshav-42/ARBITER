[project]
name = "arbiter"
version = "0.1.0"
description = "Closed-loop dispute arbitration engine with Bayesian evidence ledger and calibrated abstention"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
